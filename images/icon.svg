<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- PushDesk for LUNA icon (JOHANZE), in the style of UA's Add On icons: dark panel, one flat glyph.
       A controller: display strip over a lit pad grid, with a motor fader beside it. -->
  <defs><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2D30"/><stop offset="1" stop-color="#17181A"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="#0D0E0F"/><rect x="4" y="4" width="504" height="504" fill="url(#panel)"/><rect x="4" y="4" width="504" height="4" fill="#ffffff" opacity="0.08"/>
  <!-- controller body -->
  <rect x="70" y="92" width="300" height="328" rx="18" fill="#3A3C40"/>
  <!-- display strip with level bars -->
  <rect x="92" y="114" width="256" height="64" rx="8" fill="#0F1A22"/>
  <g fill="#4FB3FF"><rect x="106" y="146" width="22" height="20" rx="3"/><rect x="138" y="132" width="22" height="34" rx="3"/><rect x="170" y="140" width="22" height="26" rx="3"/><rect x="202" y="126" width="22" height="40" rx="3"/><rect x="234" y="150" width="22" height="16" rx="3"/><rect x="266" y="136" width="22" height="30" rx="3"/><rect x="298" y="144" width="36" height="22" rx="3" opacity="0.5"/></g>
  <!-- 4 x 4 pads, some lit -->
  <g fill="#55585E">
    <rect x="92" y="196" width="50" height="50" rx="8"/><rect x="160" y="196" width="50" height="50" rx="8"/><rect x="228" y="196" width="50" height="50" rx="8"/><rect x="296" y="196" width="50" height="50" rx="8"/>
    <rect x="92" y="264" width="50" height="50" rx="8"/><rect x="160" y="264" width="50" height="50" rx="8"/><rect x="228" y="264" width="50" height="50" rx="8"/><rect x="296" y="264" width="50" height="50" rx="8"/>
    <rect x="92" y="332" width="50" height="50" rx="8"/><rect x="160" y="332" width="50" height="50" rx="8"/><rect x="228" y="332" width="50" height="50" rx="8"/><rect x="296" y="332" width="50" height="50" rx="8"/>
  </g>
  <rect x="160" y="196" width="50" height="50" rx="8" fill="#4FB3FF"/>
  <rect x="296" y="264" width="50" height="50" rx="8" fill="#F2A33A"/>
  <rect x="92" y="332" width="50" height="50" rx="8" fill="#E8E9EB"/>
  <rect x="228" y="332" width="50" height="50" rx="8" fill="#4FB3FF"/>
  <!-- motor fader -->
  <rect x="404" y="92" width="16" height="328" rx="8" fill="#0D0E0F"/>
  <rect x="380" y="214" width="64" height="40" rx="8" fill="#E8E9EB"/>
  <rect x="384" y="232" width="56" height="4" fill="#2C2D30"/>
</svg>
